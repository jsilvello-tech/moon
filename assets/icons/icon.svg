<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141B30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1020" stop-opacity="1" />
    </radialGradient>

    <!-- Silver Moonlight Gradient for Crescent Moon -->
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#DDE5F3" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Crystal Cyan Performance Telemetry Gradient -->
    <linearGradient id="telemetryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Backdrop Disc -->
  <rect width="256" height="256" rx="56" fill="url(#spaceGlow)" />
  <rect width="256" height="256" rx="56" fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Stars / Space Sparkles -->
  <circle cx="56" cy="68" r="1.5" fill="#DDE5F3" opacity="0.6" />
  <circle cx="204" cy="52" r="2" fill="#67E8F9" opacity="0.7" />
  <circle cx="196" cy="190" r="1.5" fill="#DDE5F3" opacity="0.5" />
  <circle cx="68" cy="200" r="1.2" fill="#A78BFA" opacity="0.6" />

  <!-- Silver Crescent Moon Wrapping the Telemetry -->
  <path d="M 148 36 
           C 78 36, 26 88, 26 154 
           C 26 206, 68 238, 116 238 
           C 68 222, 54 168, 70 120 
           C 84 76, 126 50, 168 54 
           C 162 48, 155 41, 148 36 Z"
        fill="url(#moonGlow)" />

  <!-- Performance Monitoring Cyan Line (Electrocardiogram / Telemetry Wave) -->
  <g filter="url(#neonGlow)">
    <!-- Baseline guide / track -->
    <path d="M 52 144 L 92 144 L 106 112 L 122 178 L 138 98 L 154 162 L 168 132 L 180 144 L 214 144"
          fill="none"
          stroke="url(#telemetryGradient)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Leading Telemetry Point / Pulse -->
    <circle cx="214" cy="144" r="5" fill="#67E8F9" />
    <circle cx="214" cy="144" r="9" fill="#67E8F9" opacity="0.3" />
  </g>
</svg>

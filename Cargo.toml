[package]
name = "moon-monitor"
version = "0.1.0"
edition = "2021"
authors = ["Moon Monitor Contributors"]
description = "Keep your system in orbit — Monitor nativo de hardware e desempenho para Windows"
readme = "README.md"
license = "MIT"
default-run = "MoonMonitor"

[[bin]]
name = "MoonMonitor"
path = "src/main.rs"

[lib]
name = "moon_monitor"
path = "src/lib.rs"

[dependencies]
slint = "1.8"
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "5.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
]

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
